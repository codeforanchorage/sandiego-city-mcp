# OpenContext Configuration
# ==========================
#
# San Diego City GIS MCP — derived from the Worcester GIS fork.
#
# IMPORTANT: Enable ONLY ONE plugin per fork/deployment (One Fork = One MCP Server).
# See docs/ARCHITECTURE.md for details.

---
# Server metadata
server_name: "San Diego City GIS"
server_version: "1.2.0" # reported in initialize -> serverInfo; bump on protocol-visible changes
description: "City of San Diego GIS MCP server - Safe, conversational access to the city's ArcGIS Server layers"
organization: "City of San Diego"

# Guidance surfaced to the client/model in the `initialize` response. This
# is the one place to steer how the model uses the tools. Because it pushes
# the config past Lambda's 4KB environment-variable cap, the whole config is
# shipped INSIDE the deployment zip (deploy.sh) and read from there at
# runtime; OPENCONTEXT_CONFIG is left empty in Terraform.
instructions: |
  You are connected to the City of San Diego's GIS: ~700 map layers from
  the City's own ArcGIS Server (webmaps.sandiego.gov), indexed from a
  crawl of its services directory. This is CITY data -- Planning (zoning,
  community plans, habitat), Development Services (DSD), Parks, Fire,
  Stormwater, and many Hosted feature layers. Every tool is READ-ONLY and
  safe to call without confirmation.

  Workflow:
  1. search_datasets(q=...) to find layers by topic or acronym (e.g.
     'zoning', 'MHPA', 'community plan', 'fire station'). Every result is
     a queryable layer with a dataset_id.
  2. get_layer_schema(item_id=<dataset_id>) to read the REAL,
     CASE-SENSITIVE field names before writing any WHERE clause. Use
     get_distinct_values(item_id, field) to confirm the exact spelling of
     codes (e.g. 'RS-1-7' vs 'RS-1-07').
  3. query_data(dataset_id, where, out_fields, order_by, limit). The
     output leads with TOTAL MATCHING -- the full server-side count -- so
     "how many X?" needs no paging. Use order_by (e.g. 'ACRES DESC') for
     top-N questions.

  dataset_id is a services-directory PATH, not a GUID:
    {folder}/{service}/{MapServer|FeatureServer}/{layerId}
  e.g. Planning/PLN_LongRangePlanning/MapServer/7 (MHPA). Never invent
  one; take it from search_datasets.

  Location questions -- "what zone / plan area / preserve is at X?":
  spatial_query_point(item_id=<polygon layer>, address=...) geocodes a
  street address (US Census geocoder, biased to San Diego) and returns
  the attributes of every polygon containing that point; or pass lon and
  lat directly (WGS84 decimal degrees, lon FIRST, e.g. lon=-117.16,
  lat=32.72). All coordinates in and out are WGS84 -- the layers are
  authored in State Plane feet but the server handles the conversion.
  geocode_address(address) is available on its own.

  Key layers, all in Planning/PLN_LongRangePlanning/MapServer:
    /7  Multi-Habitat Planning Area (MHPA) -- fields HABPRES, INHABPRES,
        SUBAREA, ACRES
    /27 Base Zones -- the official zoning layer (ZONE_NAME)
    /24 Community Plan Land Use -- adopted plan designations
  get_aggregations(field='folder') shows how the catalog is organised.

  Limits: the catalog is a snapshot (see get_dataset for the crawl date);
  ~15 services (AMPGIS, GetItDone, PUD_*, ...) require a City login and
  are not indexed. County-wide and regional layers (parcels, SanGIS,
  SANDAG) live on the separate San Diego Regional GIS MCP server, which
  exposes the SAME tool names -- use it for anything outside City
  services. Field names are case-sensitive; an unknown field returns a
  did-you-mean suggestion rather than results.

# Plugin configuration
# ====================
#
# IMPORTANT: Enable ONLY ONE plugin below
# For additional MCP servers, fork this repository again
#
plugins:
  # Built-in: CKAN (for CKAN-based open data portals)
  ckan:
    enabled: false # Set to true to use
    base_url: "https://data.example.gov/" # CKAN API base URL
    portal_url: "https://data.example.gov/" # Public portal URL
    city_name: "Your City" # City/organization name
    timeout: 120 # HTTP timeout in seconds
    # api_key: "${CKAN_API_KEY}"  # Optional: CKAN API key for authenticated requests

  # Built-in: ArcGIS Server directory (for bare ArcGIS Server REST services
  # directories with no Hub/Open Data catalog in front of them).
  #
  # Discovery comes from a precomputed catalog manifest. Refresh it with:
  #   python scripts/crawl_catalog.py
  # then redeploy. The running server never crawls live.
  arcgis:
    enabled: true
    services_url: "https://webmaps.sandiego.gov/arcgis/rest/services"
    city_name: "City of San Diego"
    # HTTP timeout to ArcGIS Server, per request. The ladder is API Gateway
    # 29s (hard, non-adjustable) > Lambda 28s (aws.lambda_timeout below) >
    # this. A hung upstream then surfaces as a readable tool error instead
    # of the Lambda being killed mid-flight. 60 days of prod traffic showed
    # a max invocation of 1.8s, so 20s clears every observed request.
    timeout: 20
    geocoder_region: "San Diego, CA" # biases address geocoding to San Diego
    catalog_path: "plugins/arcgis/catalog.json"
    # token: "${ARCGIS_TOKEN}"  # Optional: token for non-anonymous services
    #
    # Known-good public layers, curated for search. Aliases/notes are applied
    # at load time (no re-crawl needed to edit them). All three live in the
    # anonymous Planning/PLN_LongRangePlanning MapServer.
    featured_datasets:
      - dataset_id: "Planning/PLN_LongRangePlanning/MapServer/7"
        aliases: ["MHPA", "habitat preserve", "multi-habitat planning area"]
        note: >-
          Multi-Habitat Planning Area (MHPA) -- the City's habitat preserve
          planning boundaries. Polygon layer. Key fields: HABPRES (int, %
          targeted preservation), INHABPRES (Yes/No), SUBAREA, ACRES.
      - dataset_id: "Planning/PLN_LongRangePlanning/MapServer/27"
        aliases: ["zoning", "base zones", "zone"]
        note: >-
          Base Zones -- the official City of San Diego zoning layer.
          Polygon layer; zone codes like RS-1-7, CC-3-5.
      - dataset_id: "Planning/PLN_LongRangePlanning/MapServer/24"
        aliases: ["land use", "community plan"]
        note: >-
          Community Plan Land Use -- adopted community plan land use
          designations. Polygon layer.

# AWS deployment settings
aws:
  region: "us-west-2" # AWS region for Lambda
  lambda_name: "sandiego-city-gis-mcp" # Lambda function name
  lambda_memory: 512 # Lambda memory in MB (128-10240)
  # 28s: just under REST API Gateway's hard 29s integration timeout. Anything
  # longer only burns billed compute and a reserved-concurrency slot after
  # the client already has its 504. This value WINS over prod.tfvars.
  lambda_timeout: 28

# Logging configuration
logging:
  level: "INFO" # Log level: DEBUG, INFO, WARNING, ERROR
  format: "json" # Log format: json or text
